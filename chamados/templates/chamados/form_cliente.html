{% extends 'chamados/base.html' %}

{% block title %}Novo Cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="mb-4 text-secondary">Cadastrar Novo Cliente</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3 py-2 fw-bold">Salvar e Continuar</button>
            </form>

            <a href="{% url 'lista_chamados' %}" class="btn btn-outline-secondary w-100 mt-2">Voltar para a Lista</a>
        </div>
    </div>
</div>
{% endblock %}
